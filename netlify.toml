[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old static-page URLs keep working.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/service.html"
  to = "/service"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/team.html"
  to = "/team"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

# Unknown paths fall through to dist/404.html (served with a 404 status),
# the same behaviour as the static site.
