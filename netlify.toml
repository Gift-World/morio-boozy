[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old static-page URLs keep working.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/service.html"
  to = "/service"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/team.html"
  to = "/team"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

# Hashed build output and generated image variants never change: cache for a year.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Other images and the hero video keep their names: cache for a week.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Unknown paths fall through to dist/404.html (served with a 404 status),
# the same behaviour as the static site.
